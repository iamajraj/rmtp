<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rmpt | local inbox</title>
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --surface-2: #fbfbfa;
    --border: #e6e6e2;
    --border-strong: #d9d9d4;
    --text: #1b1b18;
    --text-2: #55554f;
    --muted: #8a8a82;
    --accent: #4f46e5;
    --accent-soft: #eef0fe;
    --danger: #dc2626;
    --ok: #16a34a;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20, 20, 15, 0.04), 0 4px 16px rgba(20, 20, 15, 0.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: #d3d3cc; border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #b8b8b0; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -0.01em; font-size: 14px; }
  .brand svg { display: block; }
  .brand .sub { color: var(--muted); font-weight: 500; font-size: 12px; }
  .spacer { flex: 1; }
  .count {
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 3px 9px; border-radius: 999px;
  }
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  input[type="search"] {
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px 6px 30px; font-size: 13px; width: 240px; outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  input[type="search"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface); }
  input[type="search"]::placeholder { color: var(--muted); }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--surface); color: var(--text-2);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 12.5px; font-weight: 500; cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .icon-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #c9c9c2; flex-shrink: 0; }
  .dot.on { background: var(--ok); }
  .status-text { font-size: 12px; color: var(--muted); }

  main { flex: 1; display: flex; min-height: 0; }

  #list {
    width: 372px; min-width: 300px; max-width: 42vw;
    border-right: 1px solid var(--border);
    background: var(--surface);
    overflow-y: auto;
  }
  .msg-item {
    display: grid; grid-template-columns: 1fr auto;
    gap: 2px 10px;
    padding: 11px 16px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .12s;
    position: relative;
  }
  .msg-item:hover { background: var(--surface-2); }
  .msg-item.active { background: var(--accent-soft); }
  .msg-item.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); border-radius: 0 3px 3px 0;
  }
  .msg-item .from { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg-item .time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; align-self: center; }
  .msg-item .subject { color: var(--text-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; grid-column: 1 / -1; }
  .msg-item.active .subject { color: var(--text); }
  .msg-item .meta { grid-column: 1 / -1; color: var(--muted); font-size: 11.5px; display: flex; gap: 8px; align-items: center; }
  .msg-item .meta .att { font-size: 10px; }

  .empty-state { padding: 48px 24px; text-align: center; color: var(--muted); }
  .empty-state .ic { margin: 0 auto 14px; width: 56px; height: 56px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .empty-state .t { font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
  .empty-state .s { font-size: 12.5px; line-height: 1.5; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; background: var(--surface-2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; }

  #detail { flex: 1; overflow-y: auto; min-width: 0; background: var(--bg); }
  #detail .scroll { max-width: 860px; margin: 0 auto; padding: 28px 32px 48px; }
  #detail h1 { font-size: 21px; font-weight: 650; letter-spacing: -0.015em; margin: 0 0 14px; line-height: 1.3; }
  .envelope { display: flex; flex-direction: column; gap: 2px; margin-bottom: 20px; }
  .env-row { font-size: 13px; color: var(--text-2); }
  .env-row b { color: var(--text); font-weight: 550; margin-right: 6px; }
  .env-row .dim { color: var(--muted); font-size: 12.5px; }
  .actions { display: flex; gap: 6px; margin-bottom: 18px; }
  .actions button {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
    border-radius: 7px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .actions button:hover { border-color: var(--border-strong); color: var(--text); }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .tab {
    background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 500;
    padding: 8px 4px; margin-right: 18px; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab:hover { color: var(--text-2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .content pre {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; overflow-x: auto; white-space: pre-wrap; word-break: break-word;
    margin: 0; font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text-2);
  }
  .html-frame {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .html-frame iframe { display: block; width: 100%; min-height: 480px; border: 0; border-radius: var(--radius); }
  .hdr-table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .hdr-table td { padding: 7px 14px; border-bottom: 1px solid var(--border); vertical-align: top; font-size: 12.5px; }
  .hdr-table tr:last-child td { border-bottom: none; }
  .hdr-table td:first-child { color: var(--muted); white-space: nowrap; width: 150px; font-weight: 500; background: var(--surface-2); }
  .hdr-table td:last-child { color: var(--text-2); word-break: break-all; }

  .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .att-label { width: 100%; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .attachments a {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-2); padding: 7px 12px; font-size: 12.5px; text-decoration: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .attachments a:hover { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); color: var(--accent); }
  .attachments a .name { font-weight: 500; }
  .attachments a .sz { color: var(--muted); font-size: 11.5px; }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1f1f1b; color: #fff;
    border-radius: 9px; padding: 9px 16px; font-size: 13px; display: none; z-index: 20;
    box-shadow: 0 8px 30px rgba(0,0,0,.22);
  }
  footer {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 16px;
    background: var(--surface); border-top: 1px solid var(--border);
    color: var(--muted); font-size: 11.5px;
  }
  footer .spacer { flex: 1; }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--text); }
  footer b { color: var(--text-2); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    rmpt <span class="sub">local inbox</span>
  </div>
  <span class="count" id="count">0 messages</span>
  <div class="spacer"></div>
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="search" placeholder="Search subject, sender, body…" />
  </div>
  <span class="dot" id="dot"></span><span class="status-text" id="status-text">connecting…</span>
  <button class="icon-btn" id="refresh" title="Refresh">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    Refresh
  </button>
  <button class="icon-btn danger" id="clear">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
    Clear
  </button>
</header>
<main>
  <div id="list"><div class="empty-state"><div class="t">Loading…</div></div></div>
  <div id="detail"></div>
</main>
<footer>
  <span>rmpt</span>
  <span class="spacer"></span>
  <span>built by <b>Muhammad Raj</b> · <a href="https://github.com/iamajraj" target="_blank" rel="noopener">github.com/iamajraj</a></span>
</footer>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const listEl = $('#list'), detailEl = $('#detail'), toastEl = $('#toast');
let currentId = null;
let searchTimer = null;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.style.display = 'none', 2500);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

async function refreshHealth() {
  try {
    await api('/api/health');
    $('#dot').classList.add('on');
    $('#status-text').textContent = 'online';
  } catch (e) {
    $('#dot').classList.remove('on');
    $('#status-text').textContent = 'offline';
  }
}

async function loadMessages() {
  const q = $('#search').value.trim();
  const data = await api('/api/messages?q=' + encodeURIComponent(q));
  $('#count').textContent = `${data.total} message${data.total === 1 ? '' : 's'}`;
  renderList(data.messages);
}

function renderList(msgs) {
  if (msgs.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="ic">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="t">No messages</div>
        <div class="s">Point your app's SMTP at<br/><code>localhost:1025</code> and send something.</div>
      </div>`;
    return;
  }
  listEl.innerHTML = msgs.map(m => `
    <div class="msg-item ${m.id === currentId ? 'active' : ''}" data-id="${m.id}">
      <span class="from">${escapeHtml(m.from || '(unknown sender)')}</span>
      <span class="time">${formatTime(m.received_at)}</span>
      <span class="subject">${escapeHtml(m.subject || '(no subject)')}</span>
      <span class="meta">
        <span>${formatBytes(m.size)}</span>
        ${m.has_attachments ? '<span class="att">+ attachment</span>' : ''}
      </span>
    </div>`).join('');
  listEl.querySelectorAll('.msg-item').forEach(el => {
    el.addEventListener('click', () => {
      currentId = el.dataset.id;
      document.querySelectorAll('.msg-item').forEach(x => x.classList.toggle('active', x.dataset.id === currentId));
      loadDetail(currentId);
    });
  });
}

async function loadDetail(id) {
  detailEl.innerHTML = `<div class="scroll"><div class="empty-state"><div class="t">Loading…</div></div></div>`;
  let m;
  try {
    m = await api('/api/messages/' + id);
  } catch (e) {
    detailEl.innerHTML = `<div class="scroll"><div class="empty-state"><div class="t">Could not load message</div><div class="s">${escapeHtml(e.message)}</div></div></div>`;
    return;
  }

  const cc = m.cc && m.cc.length ? `<div class="env-row"><b>CC</b><span class="dim">${escapeHtml(m.cc.join(', '))}</span></div>` : '';

  const htmlTab = m.body_html
    ? `<div class="html-frame"><iframe sandbox="allow-popups" srcdoc="${escapeAttr(m.body_html)}"></iframe></div>`
    : `<pre>${escapeHtml(m.body_plain || 'No text body')}</pre>`;

  const atts = m.attachments.length ? `
    <div class="attachments">
      <span class="att-label">Attachments</span>
      ${m.attachments.map(a => `
        <a href="/api/messages/${encodeURIComponent(m.id)}/attachments/${a.id}" target="_blank" rel="noopener">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          <span class="name">${escapeHtml(a.filename)}</span>
          <span class="sz">${formatBytes(a.size)}</span>
        </a>`).join('')}
    </div>` : '';

  detailEl.innerHTML = `
    <div class="scroll">
      <h1>${escapeHtml(m.subject || '(no subject)')}</h1>
      <div class="envelope">
        <div class="env-row"><b>From</b><span class="dim">${escapeHtml(m.from_name || '')}</span> ${escapeHtml(m.from || '')}</div>
        <div class="env-row"><b>To</b> ${escapeHtml(m.to || '')}</div>
        ${cc}
        <div class="env-row"><b>Date</b> ${escapeHtml(formatFull(m.received_at))} · ${formatBytes(m.size)}</div>
      </div>
      <div class="actions">
        <button data-act="preview">Preview</button>
        <button data-act="text">Text</button>
        <button data-act="headers">Headers</button>
        <button data-act="raw">Raw</button>
      </div>
      <div class="content" id="tab-content">${htmlTab}</div>
      ${atts}
    </div>`;

  detailEl.querySelectorAll('.actions button').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      detailEl.querySelectorAll('.actions button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      let html;
      if (act === 'preview') html = htmlTab;
      else if (act === 'text') html = `<pre>${escapeHtml(m.body_plain || 'No text body')}</pre>`;
      else if (act === 'headers') html = headersHtml(m.headers);
      else html = `<pre>${escapeHtml(m.raw)}</pre>`;
      $('#tab-content').innerHTML = html;
    });
  });
}

function headersHtml(headers) {
  if (!headers || !headers.length) return '<div class="empty-state"><div class="t">No headers</div></div>';
  return `<table class="hdr-table">${headers.map(h => `<tr><td>${escapeHtml(h.name)}</td><td>${escapeHtml(h.value)}</td></tr>`).join('')}</table>`;
}

$('#search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadMessages().catch(e => toast(e.message)), 300);
});

$('#refresh').addEventListener('click', () => loadMessages().catch(e => toast(e.message)));
$('#clear').addEventListener('click', async () => {
  if (!confirm('Delete all messages?')) return;
  try {
    await api('/api/messages', { method: 'DELETE' });
    currentId = null;
    detailEl.innerHTML = '';
    loadMessages();
    toast('Inbox cleared');
  } catch (e) { toast(e.message); }
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape') { currentId = null; detailEl.innerHTML = ''; document.querySelectorAll('.msg-item').forEach(x => x.classList.remove('active')); }
});

function formatBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}

function formatTime(ms) {
  const d = new Date(ms), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (sameDay) return hm;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function formatFull(ms) {
  return new Date(ms).toLocaleString([], {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function tick() {
  try {
    await Promise.all([refreshHealth(), loadMessages()]);
  } catch (e) {}
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
