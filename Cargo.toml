[package]
name = "rmtp"
version = "0.1.0"
edition = "2024"
authors = ["Muhammad Raj"]
license = "MIT"
description = "Local SMTP server + web inbox for capturing and viewing emails during development"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
mail-parser = "0.11.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
